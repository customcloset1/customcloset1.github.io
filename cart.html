<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart — Custom Closet</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    body{background:#f2efe9;font-family:'Inter',sans-serif;color:#111;min-height:100vh;}
    .cnav{background:#fff;border-bottom:1px solid #e5e7eb;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
    .cnav-logo{font-weight:700;font-size:17px;text-decoration:none;color:#111;}
    .cnav-back{font-size:13px;color:#666;text-decoration:none;}
    .cart-page-title{text-align:center;padding:28px 16px 8px;font-family:'Playfair Display',serif;font-size:28px;}
    .cart-count{text-align:center;font-size:14px;color:#666;margin-bottom:20px;}
  </style>
</head>
<body>
<nav class="cnav">
  <a href="index.html" class="cnav-logo">CustomCloset</a>
  <a href="index.html" class="cnav-back">← Continue shopping</a>
</nav>
<h1 class="cart-page-title">Your Cart 🛒</h1>
<p class="cart-count" id="cartCount"></p>
<div id="cartBody"></div>

<script>
const CL='https://res.cloudinary.com/bsgynj2j/image/upload';
function getCart(){try{return JSON.parse(localStorage.getItem('cc_cart')||'[]');}catch{return[];}}
function saveCart(cart){localStorage.setItem('cc_cart',JSON.stringify(cart));}

function renderCart(){
  const cart=getCart();
  const body=document.getElementById('cartBody');
  const countEl=document.getElementById('cartCount');
  if(cart.length===0){
    countEl.textContent='';
    body.innerHTML=`<div class="cart-empty"><div class="cart-empty-icon">🛍️</div><h3 style="font-size:20px;font-weight:600;margin-bottom:8px;">Your cart is empty</h3><p style="color:#888;margin-bottom:24px;">Add some items from the trending section!</p><a href="index.html#trending" style="display:inline-block;padding:12px 28px;background:#111;color:#fff;border-radius:10px;text-decoration:none;font-weight:600;">Shop now</a></div>`;
    return;
  }
  const totalItems=cart.reduce((s,i)=>s+i.qty,0);
  const totalPrice=cart.reduce((s,i)=>s+i.price*i.qty,0);
  const totalOriginal=cart.reduce((s,i)=>s+i.original*i.qty,0);
  const totalSaved=totalOriginal-totalPrice;
  countEl.textContent=`${totalItems} item${totalItems>1?'s':''} in your cart`;

  const itemsHtml=cart.map((item,idx)=>`
    <div class="cart-item-card">
      <img class="ci-img" src="${item.img}" alt="${item.name}" onerror="this.style.display='none'"/>
      <div class="ci-info">
        <div class="ci-name">${item.name}</div>
        <div class="ci-meta">Size: <strong>${item.size}</strong> &nbsp;·&nbsp; Color: ${item.color}<br>₹${item.price.toLocaleString('en-IN')} each</div>
        <div class="ci-qty">
          <button class="ci-qty-btn" onclick="changeQty(${idx},-1)">−</button>
          <span class="ci-qty-num">${item.qty}</span>
          <button class="ci-qty-btn" onclick="changeQty(${idx},1)">+</button>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
        <div class="ci-price">₹${(item.price*item.qty).toLocaleString('en-IN')}</div>
        <button class="ci-remove" onclick="removeItem(${idx})" title="Remove">🗑</button>
      </div>
    </div>`).join('');

  body.innerHTML=`
    <div class="cart-wrap">
      <div>
        ${itemsHtml}
        <button onclick="clearCart()" style="background:none;border:none;cursor:pointer;font-size:13px;color:#dc2626;font-weight:500;margin-top:4px;font-family:'Inter',sans-serif;">🗑 Clear cart</button>
      </div>
      <div>
        <div class="cart-summary-box">
          <div class="cs-title">Order summary</div>
          <div class="cs-row"><span>Subtotal (${totalItems} item${totalItems>1?'s':''})</span><span>₹${totalOriginal.toLocaleString('en-IN')}</span></div>
          <div class="cs-row"><span>Discount</span><span style="color:#16a34a;">−₹${totalSaved.toLocaleString('en-IN')}</span></div>
          <div class="cs-row"><span>Delivery</span><span>As per location</span></div>
          <p class="delivery-note">🚚 Delivery charges will be based on your location. You will have to pay delivery charges after order confirmation.</p>
          <div class="cs-row total"><span>Total (excl. delivery)</span><span>₹${totalPrice.toLocaleString('en-IN')}</span></div>
          <button class="checkout-btn" onclick="checkout()">Proceed to pay →</button>
          <a href="index.html#trending" class="continue-btn">← Continue shopping</a>
        </div>
      </div>
    </div>`;
}

function changeQty(idx,delta){const cart=getCart();cart[idx].qty=Math.max(1,cart[idx].qty+delta);saveCart(cart);renderCart();}
function removeItem(idx){const cart=getCart();cart.splice(idx,1);saveCart(cart);renderCart();}
function clearCart(){if(confirm('Clear all items from cart?')){saveCart([]);renderCart();}}
function checkout(){
  const cart=getCart(); if(cart.length===0) return;
  const totalPrice=cart.reduce((s,i)=>s+i.price*i.qty,0);
  const firstImg=cart[0]?.img||'';
  window.location.href=`confirm.html?cart=1&price=${totalPrice}&img=${encodeURIComponent(firstImg)}`;
}
renderCart();
</script>
</body>
</html>
