<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Confirmation — Custom Closet</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    body { background:#f2efe9; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .coming-soon {
      background:white; border-radius:20px; padding:48px 40px; text-align:center;
      max-width:440px; box-shadow:0 8px 40px rgba(0,0,0,0.08);
    }
    .coming-soon h2 { font-family:'Playfair Display',serif; font-size:28px; margin-bottom:12px; }
    .coming-soon p { color:#666; margin-bottom:24px; line-height:1.6; }
    .back-link {
      display:inline-block; padding:12px 28px; background:#111; color:#fff;
      border-radius:10px; text-decoration:none; font-weight:500; font-size:14px;
    }
  </style>
</head>
<body>
  <div class="coming-soon">
    <div style="font-size:48px;margin-bottom:16px;">🛍️</div>
    <h2>Order confirmation coming soon!</h2>
    <p>Your design was saved. The payment and confirmation page is being built — check back shortly.</p>
    <a href="design.html" class="back-link">← Back to design studio</a>
  </div>
</body>
</html>
